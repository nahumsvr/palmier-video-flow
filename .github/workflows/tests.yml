name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s skills/yt-video-flow/scripts -p 'test_*.py' -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: git diff --check
